<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溫心妤 | 數位多媒體系</title>
    
    <!-- FontAwesome 圖示 (僅 CSS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎設定與亮麗動態漸層背景 */
        :root {
            --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
        }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            box-sizing: border-box;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 置中毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        /* 個人照片 */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            margin: 0 auto 20px;
            display: block;
            background-color: white;
        }

        /* 文字排版 */
        h1 {
            margin: 0 0 5px;
            font-size: 32px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 2px;
        }

        .dept {
            color: #e84393;
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .quote {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin: 0 0 25px;
            font-weight: 500;
            padding: 0 10px;
        }

        /* 技能與興趣標籤 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #4a4a4a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .tag:hover {
            transform: scale(1.05);
        }

        /* 社群連結按鈕 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            text-decoration: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .link-btn:hover {
            background: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .link-btn i {
            font-size: 22px;
            transition: color 0.3s ease;
        }

        /* 按鈕圖示顏色變化 */
        .link-btn.email i { color: #a4b0be; }
        .link-btn.email:hover i { color: #ea4335; }
        
        .link-btn.line i { color: #a4b0be; }
        .link-btn.line:hover i { color: #00c300; }
        
        .link-btn.ig i { color: #a4b0be; }
        .link-btn.ig:hover i { color: #e1306c; }
    </style>
</head>
<body>

    <!-- 主體名片區塊 -->
    <main class="glass-card">
        
        <!-- 個人照片放置區 -->
        <!-- 請將 src 替換為您的實際照片網址 -->
        <img src="profile.jpg" alt="溫心妤" class="profile-img">

        <!-- 基本資料 -->
        <h1>溫心妤</h1>
        <p class="dept">黎明技術學院 數位多媒體系</p>
        <p class="quote">「喜歡簡單生活，也喜歡認真對待每一件事。」</p>

        <!-- 標籤 (技能與興趣) -->
        <div class="tags">
            <span class="tag">#寫代碼</span>
            <span class="tag">#微積分</span>
            <span class="tag">#讀書</span>
            <span class="tag">#睡覺</span>
        </div>

        <!-- 聯絡方式 -->
        <div class="links">
            <a href="mailto:bd1151008@venus.lit.edu.tw" class="link-btn email">
                <i class="fa-solid fa-envelope"></i>
                寫信給我
            </a>

            <!-- Line: 建議可替換成您專屬的加入好友連結 -->
            <a href="https://line.me/ti/p/@jajunok97" target="_blank" rel="noopener noreferrer" class="link-btn line">
                <i class="fa-brands fa-line"></i>
                加入 Line
            </a>

            <a href="https://instagram.com/jajuyushi" target="_blank" rel="noopener noreferrer" class="link-btn ig">
                <i class="fa-brands fa-instagram"></i>
                追蹤 Instagram
            </a>
        </div>

    </main>

</body>
</html>
